<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2D6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supper Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Supper Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a weekly meal board — one card per day in planning order, with tabs for groceries, fridge, recipes, settings */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#EEF2EA; --ink:#1C251F; --muted:#5D6A61; --line:#D9DFD4;
  --accent:#2D6A4C; --accent-ink:#FFFFFF; --accent-soft:#E0EEE5;
  --sun:#D98F1E; --sun-soft:#FBEFD9; --tomato:#B9442E; --tomato-soft:#F8E2DC; --sky:#336AA6; --sky-soft:#E1EBF6;
  --shadow:0 1px 2px rgba(28,37,31,.06),0 4px 14px rgba(28,37,31,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{overflow-x:clip}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:9px;display:block}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px;line-height:17px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;transform:translateZ(0);-webkit-backface-visibility:hidden;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:30}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1}
  .tab svg{width:22px;height:22px}
  .tab .count{position:absolute;margin-left:22px;margin-top:-4px}
  .tab{position:relative}
}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.local{background:var(--sun)}
@media (max-width:760px){.status{margin-left:auto;min-width:0}}
@media (max-width:520px){.status span:last-child{display:none}.brand{font-size:19px;min-width:0}.top-in{gap:10px}}
.items li{min-width:0}
@media (max-width:760px){input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font-size:16px}}
.items li .it-x{flex:none}
/* common */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.narrow-only{display:none}
@media (max-width:900px){.narrow-only{display:inline-flex}}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:6px 9px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.4}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.quick{background:var(--accent-soft);color:var(--accent)}
.chip.fav{background:var(--sun-soft);color:var(--sun)}
.chip.red{background:var(--tomato-soft);color:var(--tomato)}
.chip.fridge{background:var(--sky-soft);color:var(--sky)}
.chip.new{background:var(--surface-2);color:var(--ink)}
.chip.warn{background:var(--sun-soft);color:var(--sun)}
.section-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.section-h h1{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.05}
.section-h h2{font-size:20px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* plan */
.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weeknav{display:flex;align-items:center;gap:4px}
.weekrange{font-family:var(--f-display);font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.05}
.weekrange small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.usefirst{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sky-soft);color:var(--sky);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:14px}
.usefirst .chip{background:var(--surface);color:var(--sky)}
.draft-note{background:var(--sun-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-h{display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.day-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:11px;background:var(--surface-2);flex:none;line-height:1}
.day-date b{font-family:var(--f-display);font-size:19px}
.day-date span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.day.today .day-date{background:var(--accent);color:var(--accent-ink)}
.day.today .day-date span{color:inherit;opacity:.85}
.day-h select{flex:1;font-weight:600}
.meal{display:flex;gap:12px;padding:4px 12px 10px;align-items:flex-start;min-width:0}
.thumb{width:84px;height:63px;border-radius:9px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:20px;overflow:hidden}
.meal-b{min-width:0;flex:1}
.meal-name{font-weight:700;font-size:15.5px;line-height:1.25;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.meal-name:hover{color:var(--accent)}
.meal-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.side-line{font-size:13px;color:var(--muted);padding:0 12px 8px;display:flex;align-items:center;gap:6px}
.side-line button{font-size:13px}
.tip{margin:0 12px 10px;font-size:13px;background:var(--tomato-soft);border-radius:9px;padding:8px 10px;color:var(--ink)}
.tip b{color:var(--tomato)}
.nocook{padding:6px 12px 14px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px}
.nocook svg{width:28px;height:28px;color:var(--accent);flex:none}
.day-f{margin-top:auto;display:flex;gap:2px;border-top:1px solid var(--line);padding:5px 6px;flex-wrap:wrap}
.day-f .btn{flex:1;justify-content:center;font-size:13px;padding:7px 6px}
.day.locked .day-f [data-act="lock"]{color:var(--sun)}
/* groceries */
.g-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.g-grid{grid-template-columns:minmax(0,1fr)}}
.aisle{margin-bottom:14px}
.aisle h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 6px}
.aisle h3 .muted{font-family:var(--f-body);font-weight:500;font-size:13px}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.items li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line)}
.items li:first-child{border-top:0}
.items li.done .it-name{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex:none;cursor:pointer;display:grid;place-items:center;margin-top:1px;background:var(--surface)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it-b{flex:1;min-width:0}
.it-name{font-weight:600}
.it-qty{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.it-for{font-size:12.5px;color:var(--muted);margin-top:1px}
.it-x{margin-left:auto}
.side-panel{display:flex;flex-direction:column;gap:14px}
/* plan */
.tonight{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.tonight .thumb{width:64px;height:48px;font-size:16px}
.tonight .grow{flex:1;min-width:0}
.tonight .meal-name{font-size:16.5px}
.useup{background:var(--sky-soft);border-radius:var(--r);margin-bottom:14px}
.useup:not([open]):has(+ .ai-bar){margin-bottom:8px}
.ai-bar{width:100%;margin-bottom:14px;padding:10px 12px}
.useup summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;color:var(--sky);font-weight:600;font-size:14px}
.useup summary::-webkit-details-marker{display:none}
.useup-t{display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:700}
.useup-t svg{width:18px;height:18px}
.useup-c{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500}
.useup-x{font-size:13px;text-decoration:underline}
.useup-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.chip-x{padding:2px 2px 2px 10px;font-size:13px}
.chip-x .btn{padding:2px}
.more{position:relative}
.more summary{list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;z-index:25;min-width:230px}
.more .menu .btn{justify-content:flex-start;color:var(--ink);border-radius:8px}
.day.past{opacity:.82}
.day-f.rate{align-items:center;justify-content:space-between;padding:6px 12px;font-size:14px}
.star.sm svg{width:20px;height:20px}
/* groceries */
.g-wrap{max-width:780px}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:-4px 0 14px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.wm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:16px}
.wm-bar .grow{flex:1;min-width:180px}
.wm-bar.editing{border-color:var(--sky);background:var(--sky-soft)}
.it-for{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items li .it-x{gap:4px;flex-wrap:nowrap}
.donebox summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.donebox summary::-webkit-details-marker{display:none}
.donebox summary h3{margin:0}
.donebox summary h3::before{content:"▸ ";color:var(--muted)}
.donebox[open] summary h3::before{content:"▾ "}
/* recipes */
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chipbtn{flex:none}
@media (max-width:760px){.rgrid.rgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rcard .rn{font-size:14px}.rcard .rb{padding:8px 9px 10px;gap:5px}}
.day-h .busy-t{flex:none;padding:5px 9px;font-size:12px}
.busy-t[aria-pressed="true"]{background:var(--sun-soft);border-color:var(--sun);color:var(--ink)}
.chip.kid{background:#FDE7EF;color:#B23A6B}
.day-f.rate{flex-direction:column;align-items:stretch;gap:6px}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.side-line{justify-content:space-between}
.scale-sel{width:auto;font-size:13px;padding:5px 26px 5px 8px;flex:none}
.scales{display:inline-flex;gap:4px;flex-wrap:wrap}
.scales .chipbtn{padding:3px 9px}
.chipbtn.usual{border-color:var(--accent);color:var(--accent)}
.tomorrow{background:var(--sun-soft);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px}
.tomorrow ul{margin:4px 0 0;padding-left:18px}
.tomorrow .meal-name{font-size:15px}
.override{align-items:flex-start;background:var(--surface);border-radius:10px;padding:9px 10px;font-size:13.5px;line-height:1.35;margin:4px 0}
.override b{font-weight:700}
.override .muted{font-size:12.5px}
.ai-all{justify-content:center;border-color:var(--accent);color:var(--accent);background:var(--surface)}
.cover{background:var(--sun-soft);border-radius:10px;padding:9px 12px;font-size:14px}
.cover.ok{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip-x.claimed{background:var(--accent-soft);color:var(--accent)}
.store-sel{width:auto;flex:none;font-size:12px;font-weight:600;padding:4px 22px 4px 8px;border-radius:99px;background-position:calc(100% - 11px) 52%,calc(100% - 7px) 52%;background-size:4px 4px}
.store-sel.sams{background-color:#E3ECF7;border-color:#9DB7D8;color:#1F4E8C}
@media (max-width:760px){.store-sel{font-size:16px;transform:scale(.75);transform-origin:right center;margin-left:-18px}}
.store-tabs{margin:-4px 0 12px}
.sams-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#EEF3FA;border:1px solid #9DB7D8;border-radius:var(--r);padding:10px 12px;margin-bottom:16px}
.sams-bar .grow{flex:1;min-width:180px}
/* cook mode */
.cook{display:flex;flex-direction:column;gap:12px;font-size:17px}
.cook h3{font-size:19px;margin-top:4px}
.cook-ing{list-style:none;margin:0;padding:0}
.cook-ing li{border-bottom:1px solid var(--line)}
.cook-ing li.hdr{font-weight:700;color:var(--accent);padding:10px 0 4px;border:0}
.cook-ing label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.cook-ing input:checked + span{text-decoration:line-through;color:var(--muted)}
.cook-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cook-steps button{display:flex;gap:12px;text-align:left;width:100%;background:var(--surface-2);border:0;border-radius:12px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;line-height:1.45}
.cook-steps .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.cook-steps li.done button{opacity:.5}
.cook-steps li.done .num{background:var(--muted)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.setup .panel h3{font-size:19px;margin:2px 0 6px}
.setup-go{grid-column:1/-1}
.ai-out{display:flex;flex-direction:column;gap:12px}
.ai-wait{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0;color:var(--muted);text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip.buyn{background:var(--sun-soft);color:var(--ink);font-weight:700}
.adjust{background:var(--accent-soft);border-radius:var(--r);padding:12px}
.adjust .label svg{width:14px;height:14px;vertical-align:-2px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent,inherit);text-decoration:underline;cursor:pointer}
.wm-btn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.wm-btn:hover{border-color:var(--sky);color:var(--sky)}
.wm-btn.on{border-style:solid;border-color:transparent;background:var(--sky-soft);color:var(--sky)}
.wm-panel{border-color:var(--sky)}
.items li .it-x{align-self:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:16px;margin-bottom:8px}
details.pantry summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.pantry summary::-webkit-details-marker{display:none}
.mini-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mini{display:flex;align-items:center;gap:8px;font-size:14px}
.mini .grow{flex:1;min-width:0}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
/* fridge */
.f-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:900px){.f-grid{grid-template-columns:minmax(0,1fr)}}
.fridge-items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.fitem .grow{flex:1;min-width:0}
.fitem b{font-weight:700}
.fitem small{display:block;color:var(--muted);font-size:12.5px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;font-weight:600}
.chipbtn:hover{border-color:var(--sky);color:var(--sky)}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sugg{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.srow .thumb{width:62px;height:47px;font-size:15px}
.srow .grow{flex:1;min-width:0}
.srow select{width:auto;max-width:130px;font-size:13px;padding:6px 26px 6px 8px}
/* recipes */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.searchbox input{padding-left:36px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.rcard:hover{border-color:var(--accent)}
.rcard .thumb{width:100%;height:auto;aspect-ratio:4/3;border-radius:0;font-size:34px;max-width:100%}
.rcard .rb{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px}
.rcard .rn{font-weight:700;line-height:1.25}
.morebtn{display:flex;justify-content:center;margin-top:16px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:761px){.modal{border-radius:18px;max-height:88vh}}
.modal-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:2}
.modal-h h2{font-size:20px;flex:1;min-width:0}
.modal-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.hero{width:100%;max-width:300px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.stars{display:inline-flex;gap:2px}
.star{border:0;background:none;padding:2px;cursor:pointer;color:var(--line)}
.star svg{width:24px;height:24px}
.star.on{color:var(--sun)}
.ing{margin:0;padding:0;list-style:none;columns:2 240px;column-gap:24px}
.ing li{padding:5px 0;border-bottom:1px solid var(--line);break-inside:avoid;font-size:14.5px}
.ing li.hdr{font-weight:700;border-bottom:0;padding-top:10px;color:var(--accent)}
.dirs p{margin:0 0 10px;max-width:68ch}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.meta-grid .card{padding:10px 12px}
.meta-grid input,.meta-grid select{margin-top:4px}
.picklist{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px;cursor:pointer;text-align:left;width:100%}
.pick:hover{border-color:var(--accent)}
.pick .thumb{width:56px;height:42px;font-size:14px}
.pick .grow{flex:1;min-width:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.formgrid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:24px}}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.pattern{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.pattern span{font-weight:600;white-space:nowrap}
.pattern select{min-width:0;width:100%}
.pattern .busy-t{padding:6px 11px;font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.copyfall{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:13px}
@media (prefers-reduced-motion:no-preference){.day,.rcard{transition:border-color .15s}}
</style>

  <optgroup label="No cooking">${NOCOOK.map(([k,l]) => `<option value="${k}" ${sel===k?'selected':''}>${esc(l)}</option>`).join('')}</optgroup>`;
}
function generateWeek(w, opts = {}){
  const keys = Object.keys(w.days).sort();
  const cookDays = keys.filter(k => !NOCOOK.some(n => n[0] === w.days[k].cat) && w.days[k].cat);
  const free = opts.unlockedOnly ? cookDays.filter(k => !w.days[k].locked) : cookDays;
  const prev = {};
  for (const k of free) { prev[k] = w.days[k].rid; w.days[k].rid = null; w.days[k].useUp = null; }
  const recent = recentIds(w.start);
  const used = new Set(Object.values(w.days).map(d => d.rid).filter(Boolean));
  let open = new Set(uncoveredLeftovers(w).map(n => n.toLowerCase()));
  const covered = [];
  for (const k of cookDays.filter(k => free.includes(k)).slice(0, S.settings.useUpOverride ? 4 : 7)) {
    if (!open.size) break;
    const d = w.days[k]; let best = null, bestScore = 0, bestHits = [];
    for (const r of S.recipes) {
      if (r.k !== 'main' || r.hide || isSeafood(r) || used.has(r.id) || /^how to /i.test(r.n) || !(r.i || []).length || (S.settings.redMode === 'avoid' && r.red)) continue;
      if (!S.settings.useUpOverride && d.cat && !inCat(r, d.cat)) continue;
      const hits = fridgeMatches(r).filter(x => open.has(x.toLowerCase()));
      if (!hits.length) continue;
      const sc = hits.length * 10 + (d.cat && inCat(r, d.cat) ? 12 : 0) - (/\bfor 1\b/i.test(r.n) ? 5 : 0) + (r.r || 0) * 0.6 + (isQuick(r) ? 0.5 : 0) + (r.kr === 1 ? 3 : r.kr === -1 ? -8 : 0) - (d.busy && !isBusyOk(r) ? 9 : 0) - (recent.has(r.id) ? 6 : 0) - (prev[k] === r.id ? 6 : 0) + Math.random() * 3;
      if (sc > bestScore) { bestScore = sc; best = r; bestHits = hits; }
    }
    if (!best) { if (S.settings.useUpOverride) break; else continue; }
    d.rid = best.id; d.useUp = bestHits; used.add(best.id); covered.push(...bestHits);
    bestHits.forEach(x => open.delete(x.toLowerCase()));
  }
  for (const k of free) { const d = w.days[k]; if (!d.rid) d.rid = pick(d.cat, w, k, Math.random, prev[k]) ?? (opts.unlockedOnly ? prev[k] : null); }
  return {covered, missed: [...open]};
}

// grocery model
function groceryModel(){
  const start = curStart(); const w = getWeek(start);
  const pantry = new Map((S.settings.pantry||[]).map(p => [p.name.toLowerCase(), p.on]));
  const need = new Set(w.need || []);
  const fridgeNames = (S.fridge.items||[]).map(f => f.name.toLowerCase().replace(/s$/,''));
  const groups = {}; const pantryHits = new Map(); const fridgeHits = [];
  const add = (it, rname) => {
    if (NOT_GROCERY.test(it.name)) return;
    const pk = pantryKey(it, pantry);
    const isP = pantry.get(pk) === true;
    const gkey = it.core || it.key;
    if (isP && !need.has(pk)) { if (!pantryHits.has(pk)) pantryHits.set(pk, new Set()); pantryHits.get(pk).add(rname); return; }
    const aisle = aisleOf(it);
    const k = aisle + '|' + gkey;
    const g = groups[k] || (groups[k] = {k, aisle, name: it.name, core: gkey, parts: [], recipes: new Set()});
    g.parts.push(it); g.recipes.add(rname);
  };
  const claims = leftoverClaims(w); const fromFridge = [];
  for (const [dk, day] of Object.entries(w.days)) {
    const mine = (claims[dk] || []).map(n => [n, fridgeRegex(n)]).filter(([, re]) => re);
    for (const rid of [day.rid, day.side]) {
      const r = rid && S.byId[rid]; if (!r) continue;
      if (NOCOOK.some(n=>n[0]===day.cat) && rid === day.rid) continue;
      const sc = day.scale || 1;
      ingOf(r).forEach(it0 => {
        const it = grocerySwap(it0, r);
        const hit = rid === day.rid && mine.find(([, re]) => re.test(' ' + it.name + ' '));
        if (hit) { fromFridge.push({leftover: hit[0], name: it.name, recipe: r.n, day: dk}); return; }
        add(sc !== 1 && it.qty != null ? {...it, qty: it.qty * sc} : it, r.n);
      });
    }
  }
  for (const [dk, day] of Object.entries(w.days)) {
    if (!day.sideText || NOCOOK.some(n=>n[0]===day.cat)) continue;
    const name = day.sideText.trim(); const low = name.toLowerCase();
    const aisle = aisleOf({name: low, unit: null});
    const k = aisle + '|' + low;
    const g = groups[k] || (groups[k] = {k, aisle, name, core: low, parts: [], recipes: new Set()});
    g.recipes.add('Side for ' + DOWL[parseISO(dk).getDay()]);
  }
  // quantities
  for (const g of Object.values(groups)) {
    const byUnit = {}; let loose = 0;
    for (const p of g.parts) { if (p.qty == null) { loose++; continue; } const u = p.unit || ''; byUnit[u] = (byUnit[u]||0) + p.qty; }
    const q = Object.entries(byUnit).map(([u,v]) => `${fmtQty(v)}${u ? ' ' + (v > 1 && /^(cup|can|jar|package|packet|bag|clove|slice|head|stalk|stick|link|sleeve)$/.test(u) ? u + 's' : v > 1 && /^(box|bunch)$/.test(u) ? u + 'es' : u) : ''}`);
    g.qty = q.join(' + ');
    g.fridge = false;
  }
  const staples = (S.settings.staples||[]).filter(s => s.on && !(w.staplesOff||[]).includes(s.name));
  const extras = w.extras || [];
  const all = [...Object.values(groups).map(g=>g.k), ...staples.map(s=>'staple|'+s.name), ...extras.map(e=>'extra|'+e.id)];
  const remaining = all.filter(k => !(w.checked||{})[k]).length;
  return {fromFridge, w, groups, pantryHits, staples, extras, remaining, total: all.length};
}

}

// ---------- Claude recipe creator ----------
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.130.0/+esm';
const IN_CLAUDE = !!window.claude;
function getKey(){ try { return localStorage.getItem('sb.anthropicKey') || ''; } catch { return ''; } }
function aiMode(){ if (S.sample) return 'sample'; if (!IN_CLAUDE && getKey()) return 'key'; return null; }
function aiPrompt(m){

  else if (m.useFridge && (S.fridge.items || []).length) lines.push(`Use up as many of these leftover ingredients as makes sense: ${S.fridge.items.map(f => f.name).join(', ')}.`);
  const existing = S.recipes.filter(r => !m.side ? r.k === 'main' : r.k !== 'main').map(r => r.n);

Family rules:
- No seafood or fish of any kind.

- They like quick weeknight cooking.
- Use ingredients from a regular US grocery store like Walmart.
- 4 to 6 servings.

Some family favorites, for taste: ${favs.join('; ')}.

Don't repeat a recipe they already have. Their recipe names: ${existing.join('; ')}.

Request:
${lines.join('\n')}

Reply with only a JSON object, no other text, in exactly this shape:
{"name": "short recipe name", "description": "one appealing sentence", "categories": ["codes from: ${TAGS.map(([k,l]) => `${k}=${l}`).join(', ')}"], "total_minutes": 30, "hands_on_minutes": 15, "servings": "4 to 6", "ingredients": ["one ingredient per string with amount first, like 1 lb boneless skinless chicken breasts"], "steps": ["one step per string"]}`;

function parseRecipeJSON(v){

  if (typeof v === 'string') { const a = v.indexOf('{'), b = v.lastIndexOf('}'); if (a < 0 || b < a) throw {code:'bad_output'}; o = JSON.parse(v.slice(a, b + 1)); }
  const strs = x => Array.isArray(x) ? x.map(y => String(y).trim()).filter(Boolean) : [];
  const r = {name: String(o?.name || '').trim(), description: String(o?.description || '').trim(), categories: strs(o?.categories).filter(c => TAGS.some(([k]) => k === c)),
    total: Math.round(+o?.total_minutes) || null, hands: Math.round(+o?.hands_on_minutes) || null, servings: String(o?.servings || ''), ingredients: strs(o?.ingredients), steps: strs(o?.steps)};

async function aiGenerate(m){ return parseRecipeJSON(await aiAsk(aiPrompt(m))); }
async function aiAsk(prompt){
  if (aiMode() === 'sample') return await S.sample.json(prompt, {modelTier:'default', cache:false});
  const key = getKey(); if (!key) throw {code:'no_key'};
  const mod = await import(SDK_URL); const Anthropic = mod.default || mod.Anthropic;
  const client = new Anthropic({apiKey: key, dangerouslyAllowBrowser: true});
  const resp = await client.beta.messages.create({
    model: 'claude-opus-5-5', max_tokens: 16000,
    betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
    output_config: {effort: 'medium'},
    messages: [{role: 'user', content: prompt}],
  });
  if (resp.stop_reason === 'refusal') throw {code:'refusal'};
  return resp.content.filter(b => b.type === 'text').map(b => b.text).join('');

Family rules:

  const rec = {id, n:r.name, k: m.side ? 'side' : 'main', c:r.categories, t:r.total, h:r.hands, s:r.servings, r:0, i:r.ingredients, d:r.steps.join('\n\n'), no:'', de:r.description, src:'Created with Claude', u:'', nu:'', red:null, img:false, nw:1, ai:1, created:Date.now()};
  if (SEAFOOD.test(rec.n + ' ' + rec.i.join(' '))) rec.sf = true;

  if (!on && wakeLock) { try { await wakeLock.release(); } catch {} wakeLock = null; }

}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-view],[data-act],[data-open],[data-tag],[data-toggle],[data-rate],[data-rtag],[data-course],[data-choose],[data-scrim]');
  if (!t) return;
  if (t.hasAttribute('data-scrim') && e.target !== t) return;
  if (t.hasAttribute('data-scrim')) return closeModal();
  if (t.dataset.view) { S.view = t.dataset.view; try { localStorage.setItem('sb.view', S.view); } catch {} closeModal(); window.scrollTo(0,0); return render(); }
  if (t.dataset.open) return openModal({type:'recipe', id:t.dataset.open});
  if (t.dataset.tag !== undefined) { S.rf.tag = S.rf.tag === t.dataset.tag ? '' : t.dataset.tag; if (t.dataset.tag === 'side' || t.dataset.tag === 'hidden') S.rf.mains = false; S.rf.limit = 60; return render(); }
  if (t.dataset.toggle) { const k = t.dataset.toggle; S.rf[k] = !S.rf[k]; S.rf.limit = 60; return render(); }
  if (t.dataset.rate) { const r = S.byId[S.modal.id]; const n = +t.dataset.rate; saveOverride(r.id, {r: r.r === n ? 0 : n}); render(); return; }
  if (t.dataset.rtag) { const r = S.byId[S.modal.id]; const c = new Set(r.c || []); c.has(t.dataset.rtag) ? c.delete(t.dataset.rtag) : c.add(t.dataset.rtag); saveOverride(r.id, {c:[...c]}); render(); return; }
  if (t.hasAttribute('data-course')) { const r = S.byId[S.modal.id]; saveOverride(r.id, {k: r.k === 'main' ? 'side' : 'main'}); render(); return; }
  if (t.dataset.choose) {
    const m = S.modal; const id = t.dataset.choose;
    editWeek(w => { const d = w.days[m.day] ||= {cat:'',rid:null}; if (m.side) { d.side = id; d.sideText = null; rememberSide(d.rid, 'r:' + id); } else { d.rid = id; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat = 'any'; d.locked = true; } });
    closeModal(); toast(m.side ? 'Side added' : 'Planned and locked'); return;
  }
  const a = t.dataset.act; const day = t.dataset.day;
  switch (a) {
    case 'close': return closeModal();
    case 'wk': S.weekOffset += +t.dataset.n; return render();
    case 'wk0': S.weekOffset = 0; return render();
    case 'generate': { let res; editWeek(w => { res = generateWeek(w, {unlockedOnly: true}); }); window.scrollTo(0,0); if ((S.fridge.items||[]).length) useUpToast(res); else toast('Your week is planned'); return; }
    case 'planhand': editWeek(()=>{}); return;
    case 'replan': { if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Tap again to clear this week'; return; } const id = iso(curStart()); const old = S.weeks[id]; delete S.weeks[id]; removeDoc('weeks/' + id); S.drafts[id] = buildDraft(curStart()); if (old) for (const [k,d] of Object.entries(old.days||{})) if (S.drafts[id].days[k]) S.drafts[id].days[k].cat = d.cat; render(); toast('Week cleared'); return; }
    case 'fill': editWeek(w => { for (const k of Object.keys(w.days).sort()) { const d = w.days[k]; if (d.cat && !d.rid && !NOCOOK.some(n=>n[0]===d.cat)) d.rid = pick(d.cat, w, k); } }); toast('Open days filled'); return;
    case 'rerollall': { let res; editWeek(w => { res = generateWeek(w, {unlockedOnly: true}); }); const locked = Object.values(getWeek(curStart()).days).filter(d => d.locked).length; if ((S.fridge.items||[]).length) useUpToast(res); else toast(locked ? `Rerolled. ${locked} locked night${locked>1?'s':''} kept.` : 'Rerolled'); return; }
    case 'savepattern': { const w = getWeek(curStart()); const p = {}; for (const [k,d] of Object.entries(w.days)) p[parseISO(k).getDay()] = d.cat || ''; S.settings.pattern = p; saveSettings(); toast('Saved as your usual week'); return; }
    case 'reroll': editWeek(w => { const d = w.days[day]; const n = pick(d.cat, w, day, Math.random, d.rid); if (n) { d.rid = n; d.locked = false; } else toast('No other recipes in this category'); }); return;
    case 'lock': editWeek(w => { w.days[day].locked = !w.days[day].locked; }); return;
    case 'clear': editWeek(w => { w.days[day] = {cat:'', rid:null, locked:false, side:null}; }); return;
    case 'pick': return openModal({type:'pick', day, onlyCat:false, focus:'pick-q'});
    case 'side': return openModal({type:'pick', day, side:true, focus:'pick-q'});
    case 'unside': editWeek(w => { w.days[day].side = null; w.days[day].sideText = null; }); return;
    case 'sidetext': { const m = S.modal; const v = (t.dataset.text || $('#side-text')?.value || '').trim(); if (!v) { $('#side-text')?.focus(); return; } editWeek(w => { const d = w.days[m.day]; d.side = null; d.sideText = v; rememberSide(d.rid, 't:' + v); }); closeModal(); toast(`Added ${v} to the grocery list`); return; }
    case 'onlycat': S.modal.onlyCat = !S.modal.onlyCat; return renderModal();
    case 'useforday': { const m = S.modal; editWeek(w => { const d = w.days[m.forDay]; d.rid = m.id; d.locked = true; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat='any'; }); closeModal(); return; }
    case 'hide': { const r = S.byId[S.modal.id]; saveOverride(r.id, {hide: r.hide ? undefined : true}); render(); return; }
    case 'delrecipe': { const id = S.modal.id; if (t.dataset.sure) { delete S.custom[id]; removeDoc('custom/' + id); rebuildRecipes(); closeModal(); render(); toast('Recipe deleted'); } else { t.dataset.sure = 1; t.innerHTML = I.trash + 'Tap again to delete'; } return; }
    case 'newrecipe': return openModal({type:'new', focus:'nf-n'});
    case 'more': S.rf.limit += 60; return render();
    // grocery
    case 'copylist': return shareText(groceryText(), 'Grocery list', 'List');
    case 'sharemenu': return shareText(menuText(), "This week's dinners", 'Menu');
    case 'uncheck': editWeek(w => { w.checked = {}; }); return;
    case 'addextra': return addFromInput('extra-in', v => editWeek(w => { (w.extras ||= []).push({id:uid(), name:v}); }));
    case 'rmextra': editWeek(w => { w.extras = (w.extras||[]).filter(x => x.id !== t.dataset.id); }); return;
    case 'stapleoff': editWeek(w => { (w.staplesOff ||= []).push(t.dataset.name); }); return;
    case 'stapleon': editWeek(w => { w.staplesOff = (w.staplesOff||[]).filter(x => x !== t.dataset.name); }); return;
    case 'addstaple': return addFromInput('staple-in', v => { S.settings.staples = [...(S.settings.staples||[]), {name:v, on:true}]; saveSettings(); render(); });
    case 'rmstaple': S.settings.staples = S.settings.staples.filter((_,i) => i !== +t.dataset.i); saveSettings(); return render();
    case 'need': editWeek(w => { (w.need ||= []).push(t.dataset.key); }); return;
    case 'unneed': editWeek(w => { w.need = (w.need||[]).filter(x => x !== t.dataset.key); }); return;
    case 'addpantry': return addFromInput('pantry-in', v => { S.settings.pantry = [{name:v.toLowerCase(), on:true}, ...(S.settings.pantry||[])]; saveSettings(); render(); });
    case 'rmpantry': S.settings.pantry = S.settings.pantry.filter((_,i) => i !== +t.dataset.i); saveSettings(); return render();
    // fridge
    case 'addfridge': return addFromInput('fridge-in', v => { v.split(/,/).map(x=>x.trim()).filter(Boolean).forEach(name => S.fridge.items = [...(S.fridge.items||[]), {id:uid(), name, added:Date.now()}]); S.fridgeDraft=''; saveFridge(); render(); });
    case 'quickfridge': S.fridge.items = [...(S.fridge.items||[]), {id:uid(), name:t.dataset.name, added:Date.now()}]; saveFridge(); return render();
    case 'mscale': S.modal.scale = +t.dataset.f; return renderModal();
    case 'kid': { const r = S.byId[t.dataset.id]; const v = +t.dataset.v; saveOverride(r.id, {kr: r.kr === v ? undefined : v}); render(); return; }
    case 'busy': editWeek(w => { const d = w.days[day]; d.busy = !d.busy; const r = d.rid && S.byId[d.rid]; if (d.busy && r && !d.locked && !isBusyOk(r) && d.cat && !NOCOOK.some(n=>n[0]===d.cat)) { const n = pick(d.cat, w, day, Math.random, d.rid); if (n) { d.rid = n; toast('Swapped in a quicker meal'); } } }); return;
    case 'draftbusy': { const w = getWeek(curStart()); w.days[day].busy = !w.days[day].busy; return render(); }
    case 'patbusy': { const dw = t.dataset.dow; S.settings.busy = {...(S.settings.busy||{}), [dw]: !S.settings.busy?.[dw]}; saveSettings(); return render(); }
    case 'cook': { const m = {type:'cook', id:t.dataset.id, done:{}, scale: +t.dataset.scale || 1}; openModal(m); keepAwake(true).then(ok => { if (ok && S.modal === m) { m.awake = true; renderModal(); } }); return; }
    case 'cookstep': { const m = S.modal; m.done[t.dataset.n] = !m.done[t.dataset.n]; return renderModal(); }
    case 'rateday': { const r = S.byId[t.dataset.id]; const n = +t.dataset.n; saveOverride(r.id, {r: r.r === n ? 0 : n}); render(); toast(r.r === n ? 'Rating cleared' : `Rated ${n} star${n>1?'s':''}`); return; }
    case 'storeview': S.storeView = t.dataset.v === 'all' ? null : t.dataset.v; return render();
    case 'sendsams': return shareText(groceryText('sams'), "Sam's Club list", "Sam's Club list");
    case 'wmedit': S.wmEdit = !S.wmEdit; return render();
    case 'wmset': return openModal({type:'wm', key:t.dataset.key, name:t.dataset.name, focus:'wm-url'});
    case 'wmsave': {
      const m = S.modal; const raw = $('#wm-url').value; const id = wmItemId(raw);
      if (!id) { m.err = raw.trim() ? 'That link has no item number in it. Open the product in your browser and copy the address from there, or type the item number.' : 'Paste a Walmart product link first.'; m.focus = 'wm-url'; return renderModal(); }
      S.walmart.map = {...(S.walmart.map || {}), [m.key]: {id, url: /^https?:/.test(raw.trim()) ? raw.trim().split('#')[0] : '', qty: Math.max(1, +$('#wm-qty').value || 1), label: $('#wm-label').value.trim(), name: m.name}};
      saveWalmart(); closeModal(); render(); toast('Walmart product saved'); return;
    }
    case 'wmremove': { const m = S.modal; const map = {...(S.walmart.map || {})}; const cur = map[m.key]; delete map[m.key];
      // Removing your own pick falls back to the default; removing the default turns it off for this item.
      if (!(cur && cur.id) && wmDefault(m.name)) map[m.key] = {off: true, name: m.name};
      S.walmart.map = map; saveWalmart(); closeModal(); render(); return; }
    case 'wmdefault': { const m = S.modal; const map = {...(S.walmart.map || {})}; delete map[m.key]; S.walmart.map = map; saveWalmart(); closeModal(); render(); toast('Using the Great Value default'); return; }
    case 'aiopen': if (t.dataset.all) { const m = {type:'ai', day:null, side:false, mood:'', fit:false, useFridge:false, allLeftovers:true, quick:false, state:'form'}; openModal(m); if (aiMode()) runAi(m); return; }
    { const d = t.dataset.day || null; const w = d && getWeek(curStart()); const dc = d && w.days[d]?.cat; return openModal({type:'ai', day:d, side:!!t.dataset.side, mood:'', fit:!!dc, useFridge:(S.fridge.items||[]).length > 0 && !t.dataset.side, quick:dc === 'quick', state:'form', focus:'ai-mood'}); }
    case 'aitoggle': { const m = S.modal; m.mood = $('#ai-mood')?.value ?? m.mood; m[t.dataset.k] = !m[t.dataset.k]; return renderModal(); }
    case 'aigo': case 'ainew': { const m = S.modal; m.mood = $('#ai-mood')?.value ?? m.mood; m.surprise = a === 'ainew' || (a === 'aigo' && m.surprise && m.state === 'done'); return runAi(m); }
    case 'aiback': { const m = S.modal; m.state = 'form'; m.surprise = false; return renderModal(); }
    case 'aisave': { const id = saveAiRecipe(S.modal); closeModal(); render(); openModal({type:'recipe', id}); toast('Saved to your recipe box'); return; }
    case 'aisaveplan': { const m = S.modal; const dayId = m.day || $('#ai-day')?.value; if (!dayId) { toast('Pick a night first'); $('#ai-day')?.focus(); return; } m.day = dayId;
      if (isDraft(curStart()) && !m.side) { const id = saveAiRecipe(m); const d = getWeek(curStart()).days[dayId]; d.rid = id; d.locked = true; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat = 'any'; closeModal(); render(); toast(`Saved for ${DOWL[parseISO(dayId).getDay()]}. Make my plan will build the rest of the week.`); return; }
      const id = saveAiRecipe(m); editWeek(w => { const d = w.days[m.day]; if (m.side) { d.side = id; d.sideText = null; rememberSide(d.rid, 'r:' + id); } else { d.rid = id; d.locked = true; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat = 'any'; } }); closeModal(); toast(m.side ? 'Side saved and added' : 'Saved and planned'); return; }
    case 'fbgoogle': return fbSignIn('google');
    case 'fbemail': return fbSignIn('email');
    case 'fbcreate': return fbSignIn('create');
    case 'fbsignout': if (fb && confirm('Sign out of family sync on this phone?')) fb.au.signOut(fb.auth); return;
    case 'fbmore': S.view = 'settings'; render(); setTimeout(() => $('#sync-panel')?.scrollIntoView({behavior:'smooth'}), 50); return;
    case 'editrec': return startEdit(S.modal);
    case 'canceledit': S.modal.edit = null; return renderModal();
    case 'saveedit': return saveEdit(S.modal);
    case 'restorerec': return restoreRecipe(S.modal);
    case 'adjust': return runAdjust(S.modal);
    case 'adjidea': { const e = S.modal.edit; e.ask = t.dataset.text; return runAdjust(S.modal); }
    case 'adjundo': { const e = S.modal.edit; if (e.before) Object.assign(e, e.before, {before: null, note: ''}); return renderModal(); }
    case 'exportdata': {
      const data = {supperBoard: 1, settings: S.settings, fridge: S.fridge, walmart: S.walmart, overrides: S.overrides, custom: S.custom, weeks: S.weeks};
      return shareText(JSON.stringify(data), 'Supper Board data', 'Data');
    }
    case 'importdata': {
      let d; try { d = JSON.parse(($('#import-in')?.value || '').trim()); } catch { d = null; }
      if (!d || d.supperBoard !== 1) { toast("That isn't copied Supper Board data."); return; }
      if (!confirm('Replace the settings, Walmart links and leftovers here with the pasted data?')) return;
      if (d.settings) { S.settings = {...structuredClone(DEFAULT_SETTINGS), ...d.settings}; upgradeSettings(); saveSettings(); }
      if (d.fridge) { S.fridge = d.fridge; persist('app/fridge', S.fridge); }
      if (d.walmart && d.walmart.map) { S.walmart = d.walmart; saveWalmart(); }
      for (const [id, o] of Object.entries(d.overrides || {})) { S.overrides[id] = o; persist('overrides/' + id, o); }
      for (const [id, r] of Object.entries(d.custom || {})) { S.custom[id] = r; persist('custom/' + id, r); }
      for (const [id, w] of Object.entries(d.weeks || {})) { if (w && w.start) { S.weeks[id] = w; persist('weeks/' + id, w); } }
      S.drafts = {}; rebuildRecipes(); render(); toast('Data loaded'); return;
    }
    case 'savekey': { const v = ($('#ai-key')?.value || '').trim(); if (!/^sk-ant-/.test(v)) { toast('That doesn\'t look like an Anthropic API key (it starts with sk-ant-).'); return; } try { localStorage.setItem('sb.anthropicKey', v); } catch {} render(); toast('API key saved on this device'); return; }
    case 'rmkey': try { localStorage.removeItem('sb.anthropicKey'); } catch {} render(); toast('API key removed'); return;
    case 'usedfridge': S.fridge.items = (S.fridge.items||[]).filter(x => x.id !== t.dataset.id); saveFridge(); return render();
  }
});
function addFromInput(id, fn){ const el = document.getElementById(id); const v = (el?.value || '').trim(); if (!v) { el?.focus(); return; } el.value = ''; fn(v); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cooking) { S.modal.done[t.dataset.cooking] = t.checked; return; }
  if (t.dataset.scale) { const id = t.dataset.scale; editWeek(w => { w.days[id].scale = +t.value; }); return; }
  if (t.matches('[data-useup-override]')) { S.settings.useUpOverride = t.checked; saveSettings(); return render(); }
  if (t.dataset.store) { const stores = {...(S.walmart.stores || {})}; if (t.value === 'walmart') delete stores[t.dataset.store]; else stores[t.dataset.store] = t.value; S.walmart = {...S.walmart, stores}; saveWalmart(); render(); toast(t.value === 'sams' ? "Moved to Sam's Club. It'll stay there every week." : 'Moved to Walmart'); return; }
  if (t.dataset.draftcat) { const w = getWeek(curStart()); w.days[t.dataset.draftcat].cat = t.value; return; }
  if (t.dataset.cat) { const id = t.dataset.cat; const v = t.value; editWeek(w => { const d = w.days[id]; d.cat = v; d.locked = false; d.rid = NOCOOK.some(n=>n[0]===v) || !v ? null : pick(v, w, id); }); return; }
  if (t.dataset.check) { const k = t.dataset.check; editWeek(w => { w.checked ||= {}; if (t.checked) w.checked[k] = true; else delete w.checked[k]; }); return; }
  if (t.dataset.staple) { S.settings.staples[+t.dataset.staple].on = t.checked; saveSettings(); return render(); }
  if (t.dataset.pantry) { S.settings.pantry[+t.dataset.pantry].on = t.checked; saveSettings(); return render(); }
  if (t.dataset.pattern) { S.settings.pattern = {...S.settings.pattern, [t.dataset.pattern]: t.value}; saveSettings(); return; }
  if (t.dataset.plan) { const rid = t.dataset.plan; const dayId = t.value; if (!dayId) return; editWeek(w => { const d = w.days[dayId]; d.rid = rid; d.locked = true; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat = 'any'; }); toast(`Planned for ${fmtD(parseISO(dayId))}`); return; }
  if (t.id === 'ws') { S.settings.weekStart = +t.value; S.drafts = {}; saveSettings(); return render(); }
  if (t.id === 'nr') { S.settings.noRepeat = +t.value; saveSettings(); return; }
  if (t.name === 'red') { S.settings.redMode = t.value; saveSettings(); return render(); }
  if (t.matches('[data-toggle-mains]')) { S.rf.mains = !t.checked; S.rf.limit = 60; return render(); }
  if (t.id === 'rsort') { S.rf.sort = t.value; return render(); }
  if (t.id === 'plan-day') { const m = S.modal; const dayId = t.value; if (!dayId) return; editWeek(w => { const d = w.days[dayId]; d.rid = m.id; d.locked = true; if (!d.cat || NOCOOK.some(n=>n[0]===d.cat)) d.cat = 'any'; }); closeModal(); toast(`Planned for ${fmtD(parseISO(dayId))}`); return; }
  if (t.id === 'm-h' || t.id === 'm-t') { const v = t.value === '' ? undefined : Math.max(0, +t.value); saveOverride(S.modal.id, {[t.id === 'm-h' ? 'h' : 't']: v}); render(); return; }
  if (t.id === 'm-q') { saveOverride(S.modal.id, {q: t.value || undefined}); render(); return; }
  if (t.id === 'm-notes') { saveOverride(S.modal.id, {no: t.value}); return; }
});
let searchTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rq') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.rf.q = t.value; S.rf.limit = 60; render(); }, 180); }
  if (t.id === 'pick-q') { S.modal.q = t.value; S.modal.focus = 'pick-q'; clearTimeout(searchTimer); searchTimer = setTimeout(renderModal, 150); }
  if (t.id === 'fridge-in') S.fridgeDraft = t.value;
  if (/^re-(n|s|i|d|ask)$/.test(t.id) && S.modal?.edit) S.modal.edit[t.id.slice(3)] = t.value;
});
document.addEventListener('toggle', e => {
  if (e.target.matches?.('[data-useup]')) { if (S.useupOpen !== e.target.open) { S.useupOpen = e.target.open; render(); } }
}, true);
document.addEventListener('click', e => { const open = document.querySelector('details.more[open]'); if (open && !open.contains(e.target)) open.open = false; if (open && e.target.closest('.menu button') && !(e.target.closest('[data-act="replan"]') && !e.target.closest('[data-act="replan"]').dataset.sure)) open.open = false; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) closeModal();
  if (e.key === 'Enter' && e.target.id === 're-ask') { e.preventDefault(); document.querySelector('[data-act="adjust"]')?.click(); return; }
  if (e.key === 'Enter' && e.target.matches('#extra-in,#staple-in,#pantry-in,#fridge-in')) { e.preventDefault(); const map = {'extra-in':'addextra','staple-in':'addstaple','pantry-in':'addpantry','fridge-in':'addfridge'}; document.querySelector(`[data-act="${map[e.target.id]}"]`)?.click(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'newform') return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const name = v('nf-n'); if (!name) return;
  const id = 'c-' + uid();
  const rec = {id, n:name, k:v('nf-k')||'main', c:[...document.querySelectorAll('.nf-c:checked')].map(x=>x.value), t:+v('nf-t')||null, h:+v('nf-h')||null, s:v('nf-s'), r:0,
    i:v('nf-i').split('\n').map(x=>x.trim()).filter(Boolean), d:v('nf-d'), no:'', de:'', src:'Added by you', u:v('nf-u'), nu:'', red:null, img:false, created:Date.now()};
  if (SEAFOOD.test(name + ' ' + rec.i.join(' '))) rec.sf = true;
  S.custom[id] = rec; persist('custom/' + id, rec); rebuildRecipes();
  closeModal(); S.view = 'recipes'; render(); openModal({type:'recipe', id}); toast('Recipe saved');
});

// ---------- bottom tab bar placement ----------
// On phones the tab bar is fixed to the bottom of the screen. iOS Safari mispositions
// fixed elements that sit inside a sticky header, so on narrow screens the bar is
// moved out of the header to be a direct child of <body>.
(() => {
  const mq = window.matchMedia('(max-width:760px)');
  const place = () => {
    const tabs = $('#tabs'), topIn = $('.top-in'), status = $('#status');
    if (!tabs || !topIn) return;
    if (mq.matches) { if (tabs.parentElement !== document.body) document.body.appendChild(tabs); }
    else if (tabs.parentElement !== topIn) topIn.insertBefore(tabs, status);
  };
  place();
  mq.addEventListener ? mq.addEventListener('change', place) : mq.addListener(place);
})();

// ---------- boot ----------
async function boot(){
  try {
    const res = await fetch('recipes.json'); S.base = await res.json();
  } catch { $('#app').innerHTML = '<div class="empty" style="margin-top:30px">The recipe file didn\'t load. Reload the page to try again.</div>'; return; }
  rebuildRecipes();
  S.mode = 'local'; // provisional until db answers
  loadLocal(); rebuildRecipes(); render(); setStatus();
  fetch('thumbs.json').then(r => r.json()).then(t => { S.thumbs = t; render(); }).catch(()=>{});
  if (window.claude?.use) { S.mode = 'loading'; setStatus(); initDb(); window.claude.use('sample').then(f => { S.sample = f || null; render(); }).catch(() => {}); }
  else if (FB_CONFIG.apiKey) startFirebase();
}
boot();
})();
</script>
